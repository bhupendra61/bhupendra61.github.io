<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhupendra Jha — RAN Design, Planning &amp; Optimization</title>
<meta name="description" content="Bhupendra Jha — RAN design, planning &amp; optimization portfolio, with a 5G Monte Carlo simulator and NG-RAN call flow visualizer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f3ec;
    --paper-2: #efe9dc;
    --ink: #1f2a2e;
    --ink-soft: #56636a;
    --signal-blue: #2a6f8f;
    --signal-blue-deep: #1c4f68;
    --amber: #d98e3f;
    --line: #d7cfbd;
    --white: #fffdf8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  h1,h2{font-family:'Space Grotesk', sans-serif; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}

  .freq-grid{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(42,111,143,0.05) 0, rgba(42,111,143,0.05) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(90deg, rgba(42,111,143,0.05) 0, rgba(42,111,143,0.05) 1px, transparent 1px, transparent 64px);
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:relative;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    z-index:10;
  }
  .topbar-inner{
    max-width:1240px;
    margin:0 auto;
    padding:16px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
  }
  .brand-mark{
    width:34px; height:34px;
    flex-shrink:0;
  }
  .brand-mark circle{
    fill:none;
    stroke:var(--signal-blue);
    stroke-width:1.6;
  }
  .brand-mark circle:nth-child(1){opacity:.9;}
  .brand-mark circle:nth-child(2){opacity:.55;}
  .brand-mark circle:nth-child(3){opacity:.3; stroke:var(--amber);}
  .brand-text h1{
    font-size:16.5px;
    font-weight:700;
    line-height:1.1;
    color:var(--ink);
  }
  .brand-text .role{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-top:2px;
  }

  .tabs{
    display:flex;
    gap:4px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:100px;
    padding:4px;
  }
  .tab{
    appearance:none;
    border:none;
    background:transparent;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
    font-weight:500;
    color:var(--ink-soft);
    padding:9px 18px;
    border-radius:100px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:.2s;
    white-space:nowrap;
  }
  .tab svg{width:15px; height:15px; flex-shrink:0;}
  .tab:hover{ color:var(--ink); }
  .tab.active{
    background:var(--signal-blue-deep);
    color:var(--white);
    box-shadow:0 2px 8px rgba(28,79,104,0.25);
  }
  .tab .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--amber);
    flex-shrink:0;
    display:none;
  }
  .tab.active .dot{ display:block; }

  @media (max-width:720px){
    .topbar-inner{ padding:14px 16px; gap:14px; }
    .tabs{ width:100%; overflow-x:auto; justify-content:flex-start; }
    .tab{ padding:8px 14px; font-size:12.5px; }
    .brand-text h1{ font-size:15px; }
  }

  /* ---------- CONTENT STAGE ---------- */
  .stage{
    flex:1;
    position:relative;
    max-width:1240px;
    width:100%;
    margin:0 auto;
    padding:20px 28px 28px;
  }
  @media (max-width:720px){ .stage{ padding:14px 12px 18px; } }

  .frame-card{
    position:relative;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(31,42,46,0.06);
    height:calc(100vh - 108px);
    min-height:520px;
  }
  @media (max-width:720px){
    .frame-card{ height:calc(100vh - 130px); border-radius:12px; }
  }

  .panel{
    position:absolute;
    inset:0;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease;
  }
  .panel.active{
    opacity:1;
    visibility:visible;
  }
  .panel iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:var(--white);
  }

  .loading{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:var(--white);
    transition:opacity .3s ease;
  }
  .loading.hide{ opacity:0; pointer-events:none; }
  .spinner{
    width:28px; height:28px;
    border-radius:50%;
    border:2.5px solid var(--line);
    border-top-color:var(--signal-blue);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:11.5px;
    font-family:'IBM Plex Mono', monospace;
    padding:0 0 18px;
  }
</style>
</head>
<body>

<div class="freq-grid"></div>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" data-tab="profile" onclick="switchTab('profile');return false;">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="4"/>
        <circle cx="17" cy="17" r="10"/>
        <circle cx="17" cy="17" r="16"/>
      </svg>
      <div class="brand-text">
        <h1>Bhupendra&nbsp;Jha</h1>
        <div class="role">RAN Design · Planning · Optimization</div>
      </div>
    </a>

    <nav class="tabs" role="tablist" aria-label="Site sections">
      <button class="tab active" data-tab="profile" onclick="switchTab('profile')" role="tab" aria-selected="true">
        <span class="dot"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.4-4 4.3-6 7.5-6s6.1 2 7.5 6"/></svg>
        Profile
      </button>
      <button class="tab" data-tab="montecarlo" onclick="switchTab('montecarlo')" role="tab" aria-selected="false">
        <span class="dot"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19v-4"/></svg>
        5G Monte Carlo Simulator
      </button>
      <button class="tab" data-tab="ngran" onclick="switchTab('ngran')" role="tab" aria-selected="false">
        <span class="dot"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="6" rx="1"/><rect x="14" y="4" width="7" height="6" rx="1"/><rect x="8.5" y="14" width="7" height="6" rx="1"/><path d="M6.5 10v2a2 2 0 0 0 2 2h1M17.5 10v2a2 2 0 0 0-2 2h-1"/></svg>
        NG-RAN Call Flow
      </button>
    </nav>
  </div>
</div>

<div class="stage">
  <div class="frame-card">

    <div class="panel active" id="panel-profile">
      <div class="loading" id="load-profile"><div class="spinner"></div>Tuning in…</div>
      <iframe id="frame-profile" title="Profile"></iframe>
    </div>

    <div class="panel" id="panel-montecarlo">
      <div class="loading" id="load-montecarlo"><div class="spinner"></div>Loading simulator…</div>
      <iframe id="frame-montecarlo" title="5G NR Monte Carlo Simulator"></iframe>
    </div>

    <div class="panel" id="panel-ngran">
      <div class="loading" id="load-ngran"><div class="spinner"></div>Loading call flow…</div>
      <iframe id="frame-ngran" title="NG-RAN Call Flow"></iframe>
    </div>

  </div>
</div>

<footer>Bhupendra Jha · Kathmandu, Nepal — Profile · 5G NR Monte Carlo Simulator · NG-RAN Call Flow</footer>

<script>
  const sources = {
    profile: 'profile.html',
    montecarlo: 'montecarlo.html',
    ngran: 'ngran.html'
  };
  const loaded = {};

  function loadIfNeeded(tab){
    if(loaded[tab]) return;
    const frame = document.getElementById('frame-' + tab);
    const loading = document.getElementById('load-' + tab);
    frame.addEventListener('load', function(){
      loading.classList.add('hide');
    }, { once:true });
    frame.src = sources[tab];
    loaded[tab] = true;
  }

  function switchTab(tab){
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => {
      const isActive = t.getAttribute('data-tab') === tab;
      t.classList.toggle('active', isActive);
      t.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
    document.getElementById('panel-' + tab).classList.add('active');
    loadIfNeeded(tab);
    if(history.replaceState){ history.replaceState(null, '', '#' + tab); }
  }

  // Deep-link support via hash
  const initial = (location.hash || '#profile').replace('#','');
  const validTabs = Object.keys(sources);
  switchTab(validTabs.includes(initial) ? initial : 'profile');
</script>

</body>
</html>
